<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupos TS3</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#06040d;--panel:rgba(16,11,30,.62);--panel2:rgba(34,24,60,.62);--panel3:rgba(52,36,92,.7);
  --line:rgba(167,139,250,.14);--line2:rgba(167,139,250,.34);
  --txt:#f6f1ff;--mut:#b6a9d6;--mut2:#8878ad;
  --acc:#a855f7;--acc2:#7c3aed;--soft:#c084fc;--sky:#60a5fa;--pink:#ec4899;
  --grad:linear-gradient(135deg,#60a5fa,#8b5cf6 52%,#ec4899);
  --glow:0 8px 26px rgba(139,92,246,.4);
  --ok:#34d399;--bad:#f87171;--warn:#fbbf24;--r:14px;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%}
body{margin:0;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--txt);
  font:13.5px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* fundo */
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body:before{background:url(skin-frost.jpg) center 46%/cover no-repeat;filter:blur(16px) saturate(1.3) brightness(.75);transform:scale(1.12)}
body:after{background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(139,92,246,.2),transparent 70%),linear-gradient(180deg,rgba(6,4,13,.3),rgba(6,4,13,.86) 70%)}
body>*:not(dialog):not(#toast){position:relative;z-index:1}

/* topo */
.hero{min-height:124px;flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:0 24px 14px;border-bottom:1px solid var(--line2);
  background:linear-gradient(180deg,transparent 30%,rgba(6,4,13,.96)),url(skin-frost.jpg) center 44%/cover}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);box-shadow:var(--glow);display:grid;place-items:center;font-weight:800;font-size:17px}
.hero h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.01em;text-shadow:0 2px 12px #000}
.hero h1 #ver{margin-left:4px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1);font-size:10.5px}
.hero small{display:block;margin-top:2px;color:var(--mut);font-size:12px;font-weight:500;text-shadow:0 1px 8px #000}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* botões */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;border-radius:10px;cursor:pointer;
  font:inherit;font-weight:600;backdrop-filter:blur(10px);transition:.15s}
.btn:hover{border-color:var(--line2);background:var(--panel3);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;filter:none;transform:none}

select.btn{max-width:210px;padding-right:8px}select.btn[hidden]{display:none}
select.btn option{background:#120c22;color:#f6f1ff}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px 24px 20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.card>h2{margin:0;padding:14px 16px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.card>h2 span{color:var(--soft)}

/* busca */
.search{margin:10px 12px;position:relative}
.search:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--mut);font-size:17px;pointer-events:none}
.search input{width:100%;padding:10px 12px 10px 34px;background:rgba(6,4,13,.7);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;outline:none;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(168,85,247,.22)}
.list{flex:1;overflow:auto;padding:0 8px 10px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:rgba(167,139,250,.25);border-radius:8px}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pessoas */
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:2px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.12s}
.row:hover{background:var(--panel2)}
.row.sel{background:rgba(168,85,247,.2);border-color:rgba(168,85,247,.5)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.who{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.who .av{width:44px;height:44px;font-size:17px}
.who b{font-size:15.5px}.who span{display:block;margin-top:1px;color:var(--mut);font-size:12px}

/* presets */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 16px 0}
.chips label{margin-right:4px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.chip{padding:5px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
.chip:hover{background:var(--acc2);border-color:var(--acc);color:#fff}
.chip.add{border-style:dashed;color:var(--mut);background:transparent}

/* grupos */
.sep{margin:14px 6px 4px;padding:5px 10px;border-radius:8px;background:rgba(124,58,237,.18);color:var(--soft);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.grp{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.12s}
.grp:hover{background:var(--panel2)}
.grp input{display:none}
.grp.dis{opacity:.45;pointer-events:none}
.box{width:19px;height:19px;border-radius:6px;border:2px solid rgba(167,139,250,.4);display:grid;place-items:center;flex:none;transition:.12s}
.grp input:checked+.box{background:var(--grad);border-color:transparent}
.grp input:checked+.box:after{content:"✓";color:#fff;font-size:12px;font-weight:800}
.grp input:disabled+.box{border-style:dotted}
.tog{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:14px;color:var(--mut);font-size:12px;cursor:pointer;white-space:nowrap}
.tog input{accent-color:var(--acc)}
.badge{margin-left:auto;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.b-has{background:rgba(52,211,153,.14);color:var(--ok)}
.b-add{background:rgba(96,165,250,.16);color:var(--sky)}
.b-rem{background:rgba(248,113,113,.14);color:var(--bad)}
.b-lock{background:rgba(248,113,113,.14);color:var(--bad)}
.permbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 16px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(251,191,36,.06);font-size:12px;color:var(--mut)}
.permbar b{color:var(--txt)}.permbar .btn{padding:5px 10px;font-size:12px}.permbar .grow{flex:1;min-width:160px}
.b-unk{background:rgba(251,191,36,.12);color:var(--warn)}

/* rodapé do painel */
footer{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(8,5,18,.6)}
.sp{flex:1}
.sum{color:var(--mut);font-size:12.5px}.sum b{color:var(--txt)}

/* aviso de atualização */
#upd{margin:12px 24px 0;padding:10px 14px;display:flex;align-items:center;gap:12px;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(90deg,rgba(96,165,250,.18),rgba(168,85,247,.2),rgba(236,72,153,.16))}
#upd[hidden]{display:none}#upd .btn{margin-left:auto}

/* toast e janela */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);max-width:80%;padding:11px 18px;border-radius:12px;
  background:rgba(14,10,26,.96);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad)}
dialog{width:90%;max-width:460px;padding:22px;background:rgba(18,12,34,.97);color:var(--txt);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog input{width:100%;margin:10px 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit}
dialog p{color:var(--mut);line-height:1.5}
.bar{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div class="hero">
  <div class="logo">G</div>
  <h1>Grupos TS3 <span id="ver"></span><small id="sub">Conectando…</small></h1>
  <div class="actions">
    <select id="srv" class="btn" hidden title="Servidor do TeamSpeak"></select>
    <button class="btn" id="chk" title="Verifica no GitHub se há versão nova (não envia nada ao servidor do TeamSpeak)">⬆ Verificar atualização</button>
    <button class="btn" id="diagb" title="Gera um relatório para enviar ao suporte">🩺 Diagnóstico</button>
    <button class="btn" id="reload">↻ Atualizar</button>
    <button class="btn" id="cfg">🔑 API key</button>
  </div>
</div>

<div id="upd" hidden><span id="updtxt"></span><button class="btn pri" id="updgo" hidden>Reiniciar agora</button></div>
<main>
  <section class="card">
    <h2>Pessoas <span id="ccount"></span></h2>
    <div class="search"><input id="qc" placeholder="Buscar pelo nome…" autofocus></div>
    <div class="list" id="clients"></div>
  </section>

  <section class="card">
    <div class="who" id="who"><div class="empty" style="padding:6px">← Escolha uma pessoa para começar</div></div>
    <div class="chips" id="presets"></div>
    <div style="display:flex;align-items:center"><div class="search" style="flex:1"><input id="qg" placeholder="Buscar grupo… (pode digitar normal: supervisor, vip, staff)"></div><label class="tog"><input type="checkbox" id="only"> só marcados</label></div>
    <div class="list" id="groups"></div>
    <footer>
      <div class="sum" id="sum">Nenhuma mudança</div>
      <div class="sp"></div>
      <button class="btn" id="reset" disabled>Desfazer</button>
      <button class="btn pri" id="apply" disabled>Aplicar</button>
    </footer>
  </section>
</main>

<div id="toast"></div>

<dialog id="rep">
  <h3 style="margin-top:0">Relatório</h3>
  <div id="reptxt" style="max-height:50vh;overflow:auto;line-height:1.5"></div>
  <div class="bar" style="margin-top:10px"><button class="btn pri" onclick="$('rep').close()">Fechar</button></div>
</dialog>

<dialog id="diag">
  <h3 style="margin-top:0">Diagnóstico</h3>
  <p>Mande este texto para o suporte.</p>
  <textarea id="diagtxt" readonly rows="12" style="width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,Consolas,monospace;user-select:text;-webkit-user-select:text"></textarea>
  <div class="bar" style="margin-top:10px"><button class="btn" id="diagcopy">Copiar</button><button class="btn pri" id="diagok">Fechar</button></div>
</dialog>

<dialog id="dlg">
  <h3 style="margin-top:0">API key do ClientQuery</h3>
  <p>No TeamSpeak: <b>Preferências → Suplementos → My Addons → Plug-ins → ClientQuery → Configurações</b>. Copie a chave e cole aqui.</p>
  <input type="password" id="key" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
  <div class="bar"><button class="btn" id="keyno">Cancelar</button><button class="btn pri" id="keyok">Salvar</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
let tneed=null,lastChk=Date.now(),probing=false,servers=[],powerErr='',pickToken=0,noRemLater=new Set(),updating=false,power=null,staged=false,noRem=new Set(),learned={},onlySel=false,groups=[],clients=[],presets=[],cur=null,orig=new Set(),want=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS={
  a:"ᴀɑȺƛαΔᗅᗩคªᎪ",b:"ʙɃвβƁᏴ฿ᏰƄ",c:"ᴄƇƈ¢©ᏟϾ",d:"ᴅĐđƊɗƉ∂",e:"ᴇЄєεɛƐ€ᕮɆɘΞΣᎬэ",f:"ꜰ₣ƒƑғϝ",g:"ɢǤƓɠ",h:"ʜɦнĦӇ",
  i:"ɪƗƖıιᎥ",j:"ᴊʝʄ",k:"ᴋƘƙкқҜҠκ",l:"ʟŁłᒪɮ",m:"ᴍмΜϻɱ₥ᎷM",n:"ɴΝƝƞηиทɳ₦ᑎᴎП",o:"ᴏØøσԾѲӨӦƟθ๏Ꝋ",p:"ᴘƤ₱ρƿ",q:"ǫɋ",
  r:"ʀƦɌяɾЯꞦɽᖇᎡ",s:"ꜱƧѕรֆȿꞨᏚ",t:"ᴛŦŧƬтτȾ",u:"ᴜυцƱʊɄ",v:"ᴠƲνʌᏙ",w:"ᴡʍωᎳ",x:"ҲЖ",y:"ʏƔуყ¥",z:"ᴢƵƶʑȥ"};
const MAP={};
for(const k in LETTERS) for(const ch of LETTERS[k]) MAP[ch]=k;
/* "esqueleto" de busca: tira acentos/enfeites, troca letras estilizadas por a-z */
const fold=s=>{
  let o='';
  for(const ch of String(s)){
    if(MAP[ch]){o+=MAP[ch];continue}
    for(const c2 of ch.normalize('NFKD')){ if(!/\p{M}/u.test(c2)) o+=MAP[c2]||c2 }
  }
  return o.toLowerCase().replace(/[^a-z0-9]+/g,'');
};
/* acha pelo "esqueleto" (letras normais) OU pelo texto original (japonês, símbolos, etc.) */
const match=(name,q)=>{
  q=q.trim(); if(!q) return true;
  const fq=fold(q);
  return (fq&&fold(name).includes(fq)) || name.toLowerCase().includes(q.toLowerCase());
};
const norm=fold;
const color=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return `hsl(${h} 55% 45%)`};
const ini=s=>{const m=[...s.replace(/[^\p{L}\p{N}\s]/gu,'').trim()];return (m[0]||'?').toUpperCase()};

async function post(p,b={}){
  let r;
  try{r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'gts3'},body:JSON.stringify(b)})}
  catch(e){throw new Error('O app local parou de responder. Feche esta janela e abra o Grupos TS3 de novo.')}
  const j=await r.json(); if(!r.ok) throw new Error(j.error||'erro'); return j;
}
let tt;function toast(t,ok=true){const e=$('toast');e.textContent=t;e.className='show '+(ok?'ok':'bad');clearTimeout(tt);tt=setTimeout(()=>e.className='',3500)}

function setSub(){$('sub').textContent=`${clients.length} online · ${groups.length} grupos`}
function tlock(){return false}

function renderClients(){
  const q=$('qc').value;
  const list=clients.filter(c=>match(c.name,q));
  $('ccount').textContent=clients.length+' online';
  $('clients').innerHTML=list.map(c=>`<div class="row ${cur&&cur.cldbid===c.cldbid?'sel':''}" data-id="${c.cldbid}"><div class="av" style="background:${color(c.name)}">${esc(ini(c.name))}</div><div class="nm">${esc(c.name)}</div></div>`).join('')||'<div class="empty">Ninguém encontrado</div>';
  $('clients').querySelectorAll('.row').forEach(el=>el.onclick=()=>pick(clients.find(c=>c.cldbid===el.dataset.id)));
}
function renderWho(){
  $('who').innerHTML=cur?`<div class="av" style="background:${color(cur.name)}">${esc(ini(cur.name))}</div><div><b>${esc(cur.name)}</b><span>${orig.size} grupo(s) atual(is) · ID ${cur.cldbid}</span>${tlock()?`<span style="color:var(--bad);font-weight:600">🔒 Você não tem poder para alterar esta pessoa (ela exige ${tneed}; o seu é ${power.cpm})</span>`:''}</div>`:'<div class="empty" style="padding:6px">← Escolha uma pessoa para começar</div>';
}
let queue=[];
function renderGroups(keep){
  const q=$('qg').value;
  const list=groups.filter(g=>match(g.name,q))
    .filter(g=>!onlySel||want.has(g.sgid)||orig.has(g.sgid));
  $('groups').innerHTML=list.map(g=>{
    const has=orig.has(g.sgid),w=want.has(g.sgid);
    const badge=has&&w?'<span class="badge b-has">tem</span>':!has&&w?'<span class="badge b-add">+ adicionar</span>':has&&!w?'<span class="badge b-rem">− remover</span>':'';
    const sep=g.name.match(/≪(.+?)≫/);
    if(sep) return `<div class="sep">${esc(sep[1])}</div>`;
    return `<label class="grp ${cur?'':'dis'}" data-sg="${g.sgid}"><input type="checkbox" data-id="${g.sgid}" ${w?'checked':''}><span class="box"></span><span class="nm">${esc(g.name)}</span>${badge}</label>`}).join('')||'<div class="empty">Nenhum grupo</div>';
  $('groups').querySelectorAll('input').forEach(i=>i.onchange=()=>{const id=i.dataset.id;i.checked?want.add(id):want.delete(id);update(false)});
}
function renderPresets(){
  $('presets').innerHTML='<label>Presets</label>'+presets.map((p,i)=>`<span class="chip" data-i="${i}" title="Clique: marca os grupos • Shift+clique: apaga">${esc(p.name)}</span>`).join('')+'<span class="chip add" id="addp">+ salvar seleção</span>';
  $('presets').querySelectorAll('.chip[data-i]').forEach(el=>el.onclick=async e=>{
    const i=+el.dataset.i,p=presets[i];
    if(e.shiftKey){presets.splice(i,1);await post('/api/presets',{presets});return renderPresets()}
    if(!cur) return toast('Escolha uma pessoa primeiro',false);
    let miss=0,blocked=0;p.names.forEach(n=>{const g=groups.find(g=>norm(g.name)===norm(n));if(!g)return miss++;want.add(g.sgid)});
    update();if(miss||blocked)toast((blocked?blocked+' tag(s) sem permissão foram ignoradas. ':'')+(miss?miss+' do preset não existem mais.':''),false);
  });
  $('addp').onclick=async()=>{
    if(!cur||!want.size) return toast('Escolha uma pessoa e marque grupos primeiro',false);
    const name=prompt('Nome do preset:');if(!name)return;
    presets.push({name,names:[...want].map(id=>groups.find(g=>g.sgid===id).name)});
    await post('/api/presets',{presets});renderPresets();
  };
}
function diff(){return{add:[...want].filter(x=>!orig.has(x)),rem:[...orig].filter(x=>!want.has(x))}}
function update(full=true){
  const d=diff(),n=d.add.length+d.rem.length;
  $('sum').innerHTML=n?`<b>+${d.add.length}</b> adicionar · <b>−${d.rem.length}</b> remover`:'Nenhuma mudança';
  $('apply').disabled=!cur||!n||probing;$('reset').disabled=!n;
  if(full)renderGroups();else renderGroups();
}

async function probeRemove(){ noRem=new Set(); }   // não pergunta mais ao servidor: usa a regra de poder
async function pick(c){
  const token=++pickToken;                                // evita mostrar os grupos da pessoa errada se você clicar rápido
  cur=c;tneed=null;noRem=new Set();noRemLater=new Set();probing=false;queue=[];
  orig=new Set();want=new Set();renderClients();renderWho();update();   // limpa já: nunca aplica a seleção da pessoa anterior
  try{
    const r=await post('/api/member',{cldbid:c.cldbid});
    if(token!==pickToken) return;
    orig=new Set(r.sgids);want=new Set(r.sgids);renderClients();renderWho();update();
    
  }catch(e){toast(e.message,false)}
  renderGroups();
}
async function loadServers(){
  try{
    const r=await post('/api/servers');servers=r.servers||[];
    const el=$('srv');el.hidden=servers.length<2;
    if(r.choose)toast('Você tem mais de um servidor aberto: escolha o seu no topo',false);
    el.innerHTML=servers.map(s=>`<option value="${esc(s.sch)}" ${s.sch===r.selected?'selected':''}>${esc(s.name)}</option>`).join('');
  }catch(e){}
}
$('srv').onchange=async e=>{
  try{await post('/api/server/select',{sch:e.target.value});cur=null;orig=new Set();want=new Set();renderWho();await load();toast('Servidor trocado')}
  catch(err){toast(err.message,false)}
};
async function load(){
  try{
    await loadServers();
    const r=await post('/api/info');groups=r.groups.sort((a,b)=>a.sortid-b.sortid||(+a.sgid)-(+b.sgid));
    clients=r.clients.sort((a,b)=>fold(a.name).localeCompare(fold(b.name))||a.name.localeCompare(b.name));
    presets=(await post('/api/presets')).presets;
    setSub();
    renderClients();renderPresets();update();
  }catch(e){$('sub').textContent='Sem conexão';toast(e.message,false)}
}
$('only').onchange=e=>{onlySel=e.target.checked;renderGroups()};$('qc').oninput=renderClients;$('qg').oninput=renderGroups;
/* ao voltar para a janela: atualiza a lista e os grupos da pessoa (se você não tem mudança pendente) */
let busy=false,lastSoft=0;
async function softRefresh(){
  if(busy||document.hidden||Date.now()-lastSoft<20000) return; busy=true;lastSoft=Date.now();
  try{
    const r=await post('/api/info');
    clients=r.clients.sort((a,b)=>fold(a.name).localeCompare(fold(b.name))||a.name.localeCompare(b.name));
    setSub();
    const clean=cur&&[...want].sort().join()===[...orig].sort().join();
    if(clean){const m=await post('/api/member',{cldbid:cur.cldbid});orig=new Set(m.sgids);want=new Set(m.sgids);noRemLater=new Set();renderWho()}
    renderClients();update();
  }catch(e){}
  busy=false;
}
window.addEventListener('focus',softRefresh);
document.addEventListener('visibilitychange',softRefresh);
setInterval(softRefresh,90000);
$('reload').onclick=async()=>{await post('/api/forget').catch(()=>{});await load();if(cur){const c=clients.find(x=>x.cldbid===cur.cldbid);c?pick(c):(cur=null,renderWho(),update())}};
$('reset').onclick=()=>{want=new Set(orig);update()};
$('apply').onclick=async()=>{
  const d=diff();if(!d.add.length&&!d.rem.length)return;
  const nm=id=>(groups.find(g=>g.sgid===id)||{}).name||id;
  $('apply').disabled=true;probing=true;
  try{
    const r=await post('/api/apply',{cldbid:cur.cldbid,add:d.add,remove:d.rem});
    const bad=new Map((r.failed||[]).map(f=>[f.action+f.sgid,f]));
    const done=[...d.add.filter(id=>!bad.has('add'+id)).map(id=>'+ '+nm(id)),...d.rem.filter(id=>!bad.has('rem'+id)).map(id=>'− '+nm(id))];
    const why=e=>/2568/.test(e)?'não tem permissão':/2561/.test(e)?'a pessoa já tem essa tag':/2563/.test(e)?'a pessoa não tem essa tag':/2564/.test(e)?'grupo padrão não pode ser mudado':e.replace(/\(id=.*$/,'').trim();
    const fails=(r.failed||[]).map(f=>(f.action==='add'?'adicionar ':'remover ')+nm(f.sgid)+' — '+why(f.error));
    showReport(cur.name,done,fails);
    orig=new Set((await post('/api/member',{cldbid:cur.cldbid})).sgids);want=new Set(orig);
    probing=false;renderWho();update();if(staged)setTimeout(()=>$('updgo').click(),2500)}
  catch(e){probing=false;toast(e.message,false);update()}
};
function showReport(who,done,fails){
  const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
  $('reptxt').innerHTML=`<p style="margin:0 0 8px">Pessoa: <b>${esc(who)}</b></p>`+
    (done.length?`<div style="color:var(--ok,#4ade80);font-weight:700;margin-top:8px">✔ Feito (${done.length})</div><ul>${li(done)}</ul>`:'')+
    (fails.length?`<div style="color:var(--bad,#f87171);font-weight:700;margin-top:8px">✖ Não consegui (${fails.length})</div><ul>${li(fails)}</ul>`:'')+
    (!fails.length?'<p>Tudo certo, nenhuma falha.</p>':'');
  $('rep').showModal();
}
$('diagb').onclick=async()=>{
  $('diagtxt').value='Rodando…';$('diag').showModal();
  try{$('diagtxt').value=(await post('/api/diag/update')).report}catch(e){$('diagtxt').value='atualização: '+e.message}
};
$('diagok').onclick=()=>$('diag').close();
$('diagcopy').onclick=async()=>{$('diagtxt').select();try{await navigator.clipboard.writeText($('diagtxt').value);toast('Copiado')}catch(e){document.execCommand('copy');toast('Copiado')}};
$('cfg').onclick=()=>$('dlg').showModal();
$('keyno').onclick=()=>$('dlg').close();
$('keyok').onclick=async()=>{await post('/api/config',{apikey:$('key').value});$('dlg').close();load()};
window.addEventListener('pagehide',()=>{try{fetch('/api/bye',{keepalive:true})}catch(e){}});
setInterval(()=>fetch('/api/ping').catch(()=>{}),3000);fetch('/api/ping').catch(()=>{});
/* ---- atualização automática pelo GitHub ---- */
const banner=(t,btn)=>{$('upd').hidden=false;$('updtxt').textContent=t;$('updgo').hidden=!btn};
async function checkUpdate(manual){
  lastChk=Date.now();
  if(manual) $('chk').textContent='⏳ Verificando…';
  try{
    const c=await post('/api/update/check');
    if(!c.ok){ $('chk').textContent='⬆ Verificar atualização'; if(manual) toast(c.error,false); return }
    if(!c.available){ $('chk').textContent='✓ Atualizado (v'+c.current+')'; if(manual) toast('Você já está na versão mais nova ('+c.current+') · fonte: '+(c.source||'?')); return }
    if(updating){ if(manual) toast('Já estou baixando a versão '+c.latest+'…'); return }
    updating=true;
    $('chk').textContent='⬇ Baixando v'+c.latest+'…';
    banner('⬇ Baixando a versão '+c.latest+'…',false);
    const d=await post('/api/update/download');
    updating=false;
    banner('✅ Versão '+d.latest+' baixada'+(c.notes?' — '+c.notes:''),true);
    $('chk').textContent='✅ v'+d.latest+' baixada';
    // atualização automática: reinicia sozinho se você não tem mudanças marcadas; senão espera você aplicar
    staged=true;
    const pending=cur&&[...want].sort().join()!==[...orig].sort().join();
    if(!pending) setTimeout(()=>$('updgo').click(),1200);
    else banner('✅ Versão '+d.latest+' baixada — vai reiniciar quando você terminar (ou clique ao lado)',true);
  }catch(e){ updating=false; $('chk').textContent='⬆ Verificar atualização'; if(manual) toast('Falha ao atualizar: '+e.message,false); else $('upd').hidden=true }
}
$('chk').onclick=()=>checkUpdate(true);
$('updgo').onclick=async()=>{
  if($('updgo').dataset.busy) return; $('updgo').dataset.busy='1';
  banner('Reiniciando…',false);
  await post('/api/restart').catch(()=>{});
  const t0=Date.now();
  const iv=setInterval(async()=>{ if(Date.now()-t0>30000){clearInterval(iv);banner('⚠ Não reiniciou sozinho: feche o app e abra de novo (a versão nova já está baixada).',false);$('updgo').dataset.busy='';return} try{ const r=await fetch('/api/status'); if(r.ok&&Date.now()-t0>1500){clearInterval(iv);location.reload()} }catch(e){} },700);
};
setTimeout(()=>checkUpdate(false),800);
setInterval(()=>checkUpdate(false),30*60*1000);
window.addEventListener('focus',()=>{if(Date.now()-lastChk>10*60*1000){lastChk=Date.now();checkUpdate(false)}});
(async()=>{const s=await (await fetch('/api/status')).json();$('ver').textContent='v'+(s.version||'');if(!s.hasKey)$('dlg').showModal();else load()})();
</script>
